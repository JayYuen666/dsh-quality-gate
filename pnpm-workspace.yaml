# esbuild 由 vite 传递引入，其安装脚本负责落下当前平台的二进制；本仓没有包直接依赖它。
# e2e 的真进程执行器经 dsh-bash-local 依赖 dsh-subprocess-local：后者的 postinstall 落
# spawn helper，连带 koffi / node-pty 两枚原生模块的安装脚本。pnpm 12 对「没做过决定」
# 的依赖直接 ERR_PNPM_IGNORED_BUILDS，install 半途失败，三个都得显式放行。
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  esbuild: true
  koffi: true
  node-pty: true
# 发布冷却刻意为 0：内部 @jayyuen66/* 与宿主族 rc 包必须发布后即时可装；第三方新版的供应链
# 缓冲由 catalog 与 overrides 的精确钉版承担，不靠时间窗。
minimumReleaseAge: 0

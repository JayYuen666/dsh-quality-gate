# 依赖更新：action 一条线。
#
# action 侧覆盖本仓的全部 workflow 引用：这些引用都钉了 commit SHA，Dependabot 提的 PR
# 会把「换了哪个提交」变成一次可评审的 diff。
#
# 这里刻意**没有** npm 更新块。本仓的依赖分三类，Dependabot 对前两类做不出有意义的 PR：
#   · 用 catalog: 书写的那批，范围的唯一来源在伞根的 pnpm-workspace.yaml，改这里改不动它；
#   · 字面版本书写的那批，绝大多数在 overrides 里被钉成确切版本（宿主族统一 0.2.2-alpha.2，
#     其中也包括 `@deepseek-ai/dsh` 自己），Dependabot 提的 PR 会被 overrides 解析回原版本，
#     合进去也不改变安装树。
# 例外是 devDependencies 的 `react`（`^19.3.0`，不在 overrides 里）与 peer 段的三条
# （`@deepseek-ai/dsh`、`@deepseek-ai/dsh-credentials` 的 `^0.2.1-rc.3`，以及
# `@deepseek-ai/schemastery` 的确切版本）。peer 三条虽然也在 overrides 里，但 peer 声明是发布契约
# （决定宿主装不装得下这个包），overrides 只决定安装树里的实际版本，两者管的不是同一件事：
# 更新机器人改 peer 不会被「解析回原范围」，而是直接改发布契约。
# 它们仍不该交给更新机器人：react 的版本由宿主客户端模块表决定（与宿主换 React 大版本是同一件事），
# peer 面要人工决定，不是「有新版就升」。
# 代价也说清：这几条目前没有任何 PR 提醒。要升它们只能由人盯宿主版本线。
#
# 冷却（cooldown）刻意不写：Dependabot 对**版本更新**默认已经套 3 天冷却（新版本发布满 3 天
# 才进版本更新 PR），显式配一遍同样的值不改变行为。安全更新不吃这层冷却——那类更新应当立刻提，
# 而本仓的 action 引用都钉着 commit SHA，安全更新也只能在评审后才被合并。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # 本仓引用的 action 全部放进一组，避免每个 action 各占一个 PR 去抢同一个名额。
      # 组内 patterns 是无序并集匹配，不是「按顺序命中第一条」：列一条 `*` 之后，
      # 再按 owner 列举的条目在语义上全是冗余，所以只留这一条。新增 workflow 引进别的
      # owner 的 action 时默认入组，不会悄悄掉到组外单独占一个 PR 名额。
      actions:
        patterns:
          - "*"

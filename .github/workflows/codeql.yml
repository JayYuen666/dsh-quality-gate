# CodeQL：两格并跑。
#
# javascript-typescript 扫源码；actions 扫 .github/workflows/*.yml —— 后者正是
# 本仓这一层最需要的一种检查：工作流里的表达式注入、过度权限、可被 fork PR 触发的
# 危险形态，都是「代码全绿但门禁本身有洞」那一类。
#
# 不给 build-mode：JS/TS 与 actions 都走默认的 none，不需要编译。
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动入口：修完一条告警想立刻复验时，不必等下一周的 cron。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
# 组键带事件名：周度扫描与 main 上的 push 落在不同组，前者不会因为一次 push 被取消。
# 取消给 push 与 pull_request 两种「同一 ref 上会连环重跑」的事件：同一分支连推、或同一个
# PR 反复提交时，旧那一轮的扫描没有任何人还要它的结论。其余事件各占一组，互不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
# 工作流级只给读；写入权限挂在 job 上，因为只有上传 SARIF 那一步需要它。
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # fork PR 上 security-events 的写权限拿不到（token 被降级成只读），上传 SARIF 那一步
    # 必然失败。这里不整 job 跳过（skipped 在分支保护里算通过，等于未扫描即绿），改为只给
    # analyze 步骤对 fork PR 容错：init 与查询照常执行，同仓 PR / push / schedule 的失败仍判红。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # 上传 SARIF 到 code scanning 面板所必需。
      security-events: write
      contents: read
      # 私有仓下 init/analyze 要读本次运行的工作流元数据（判断该 ref 是否已有分析、
      # 回写状态），缺它表现为权限不足而不是一条看得懂的报错。本仓当前是 public，
      # 这一条不是实测缺过权限才加的；显式声明是为了可见性变化时不会静默缺权限。
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # 两个标识都按官方清单写死：javascript-typescript 覆盖 JS 与 TS；
        # actions 覆盖本仓 .github/workflows 下的工作流文件。
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本工作流只有 checkout / init / analyze 三步，不需要任何 git 写操作，token
          # 没有留在 .git/config 里的理由；这个 job 又握着 security-events: write，
          # 少一处可被读到的凭据就少一条被放大的路径。
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        # 只有 fork PR 需要容错：它的 token 只读，上传 SARIF 必然失败；其余事件的分析失败
        # 必须把 job 判红。category 带事件名，避免 schedule 与 push 在同一 commit 上互相覆盖。
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}-${{ github.event_name }}

# actionlint 的按文件豁免（1.7.12 实测：只有在本 git 仓库里才会被自动发现）。
#
# CI 的 actionlint 步骤**不使用本文件**：ci.yml 分两次调用，SC2016 的 `-ignore` 只传给
# 真正需要它的 ci.yml 与 publish.yml。本文件只服务「本地直接跑 actionlint」的场景，
# 两份文件的探针都用单引号包住含模板串的 JS，shellcheck 对「单引号里出现 $」报 SC2016，属误报。
#
# 豁免值按 shellcheck 的具体消息收窄，而不是裸规则名或只到级别：作用于整份文件时，
# `SC2016` / `SC2016:info` 会把该文件里任何位置真实写出的同类缺陷一起吞掉。
#
# 不能加 `^` 锚：actionlint 把忽略式匹配到完整消息上，而那条消息以
# `shellcheck reported issue in this script: ` 开头，`SC2016` 并不在行首——
# 实测 `^SC2016` 一条都匹配不到，配置看似生效实则全部落空。
paths:
  .github/workflows/ci.yml:
    ignore:
      - "SC2016:info:.*Expressions don't expand in single quotes"
  .github/workflows/publish.yml:
    ignore:
      - "SC2016:info:.*Expressions don't expand in single quotes"
